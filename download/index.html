  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:

  .card{
    width:100%;
    max-width:520px;
    background:rgba(18,18,16,.78);
    border:1px solid rgba(255,255,255,.10);
    border-radius:28px;
    padding:30px 22px 24px;

    text-align:center;
  }
  .logo{
    max-width:220px;
    margin:0 auto 24px;
  }
  .eyebrow{
    color:#e8a94f;
    font-size:12px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin-bottom:10px;
  }

    line-height:1.04;

  }

    color:#d8d0c3;
    font-size:16px;
    line-height:1.55;
    max-width:390px;
    margin:0 auto 24px;
  }
  .buttons{
    display:grid;
    gap:14px;
    margin-top:22px;
  }
  .store-btn{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    padding:0;
    background:none;
    border:none;
    text-decoration:none;
}

.store-btn img{
    width:100%;
    max-width:200px;
    height:auto;
    display:block;
}
  .store-btn:active{transform:scale(.985);}
  .icon{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    flex-shrink:0;
  }
  .small{
    display:block;
    color:#cfc8bc;
    font-size:11px;
    font-weight:600;
    letter-spacing:.2px;
    line-height:1.1;
    margin-bottom:3px;
  }
  .big{
    display:block;
    color:#fff;
    font-size:22px;
    font-weight:800;
    line-height:1.1;
  }
  .note{
    color:#a89f92;
    font-size:12.5px;
    margin:18px auto 0;
  }
  .back{
    display:inline-flex;
    margin-top:22px;
    color:#e8a94f;
    font-size:14px;
    font-weight:700;
    text-decoration:none;
